[package]
name = "onetext"
version = "0.2.1"
edition = "2021"

[dependencies]
# GUI Engine & UI Framework
# GPUI is published as the pinned `gpui-pre-*` snapshot family that
# gpui-component 0.8 is built against; the versions must match exactly.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui-component = "0.8.0"
gpui-kit-assets = "0.8.0"

# Data & Logic
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.101"
clap = { version = "4.5.57", features = ["derive"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# System Integration
rfd = "0.17"
directories = "6.0"

# Printing
krilla = "0.8"
chrono = "0.4.43"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
tempfile = "3.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
# See patches/README.md: search panel re-selected its query on every keystroke.
gpui-component = { path = "patches/gpui-component" }
